# SOCKS5 inbound through a Snell server (one-shot).
# snell-rs client --config examples/client.ini

[snell-client]
# Local SOCKS5 bind address (required).
listen = 127.0.0.1:1080
# Snell server address (required).
server = 198.51.100.1:8388
# Raw UTF-8 PSK, length 16..=255 (required).
psk = example-psk-16-bytes
# v4 | v5 | v6-default | v6-unshaped (required).
version = v6-default
# CONNECT_V2 client pool. Default false.
reuse = false
