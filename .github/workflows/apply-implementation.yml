name: Apply validated implementation
on:
  push:
    branches: [codex/memory-throughput-foundation]
    paths: [.github/workflows/apply-implementation.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/memory-throughput-foundation
          fetch-depth: 2
      - name: Verify and apply source changes
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          test "$(git rev-parse HEAD^)" = 68a5a938f827892a48615a1aaa4fbbd2a5455e44
          python3 - <<'PY'
          import base64, hashlib, lzma
          from pathlib import Path
          encoded = ''.join(Path(f'.github/implementation/part{i}.b64').read_text() for i in range(1, 5))
          patch = lzma.decompress(base64.b64decode(encoded, validate=True))
          assert hashlib.sha256(patch).hexdigest() == '706e597210b76a43d4fed0f368f817df9af6a93a6b94d9f543ebf97ededb6b52'
          Path('/tmp/source.patch').write_bytes(patch)
          PY
          git apply --unidiff-zero --check /tmp/source.patch
          git apply --unidiff-zero --index /tmp/source.patch
          rm .github/implementation/part{1,2,3,4}.b64
          rmdir .github/implementation
          git add -u
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'perf(runtime): bound sessions, shrink idle buffers and decouple UDP forwarding' -m 'Use bounded BufMut initialization, cancellation-safe resource ownership, continuous handshake deadlines, timed reuse expiry, shared session configuration and static codec dispatch. Remove manual release paths, redundant buffer replacement and retained initial payloads. Add regression coverage, fuzz targets and isolated measurements.'
          git push origin HEAD:codex/memory-throughput-foundation
          git rev-parse HEAD
