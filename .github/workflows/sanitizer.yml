name: Sanitizer

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: rust-src
      - name: AddressSanitizer on protocol buffers and runtime
        run: |
          cargo test -p snell-protocol --lib --all-features --target x86_64-unknown-linux-gnu
          cargo test -p snell-runtime --lib --all-features --target x86_64-unknown-linux-gnu
        env:
          RUSTFLAGS: "-Zsanitizer=address"
          RUSTDOCFLAGS: "-Zsanitizer=address"
          ASAN_OPTIONS: detect_leaks=0
