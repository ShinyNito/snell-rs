[workspace]
resolver = "3"
members = [
  "crates/snell-protocol",
  "crates/snell-runtime",
  "crates/snell-config",
  "crates/snell",
  "crates/snell-testkit",
  "xtask",
]
exclude = ["repos"]

[workspace.package]
edition = "2024"
rust-version = "1.98.0"
license = "MIT"
repository = "https://github.com/ShinyNito/snell-rs"
version = "0.0.0"
publish = false

[workspace.dependencies]
anyhow = "1"
argon2 = "0.5.3"
blake2 = "0.10.6"
clap = { version = "4", features = ["derive"] }
hickory-resolver = { version = "0.26.1", default-features = false, features = [
  "tokio",
  "system-config",
] }
ring = "0.17"
rustix = { version = "0.38", default-features = false, features = ["net", "std"] }
thiserror = "2"
tokio = { version = "1.53.1", default-features = false }
tracing = { version = "0.1.41", default-features = false, features = ["std"] }
tracing-subscriber = { version = "0.3.19", default-features = false, features = [
  "env-filter",
  "fmt",
  "ansi",
  "time",
] }
zeroize = { version = "1", features = ["derive"] }
zerocopy = { version = "0.8", default-features = false, features = ["derive"] }

[profile.release]
opt-level = 3
lto = "fat"
codegen-units = 1
incremental = false
panic = "abort"
strip = "symbols"

[profile.bench]
debug = 1
lto = "fat"
codegen-units = 1
