name: Fuzz

on:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  fuzz:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - name: Skip until Phase 2 fuzz targets exist
        run: |
          if [ ! -d fuzz/fuzz_targets ] || [ -z "$(ls -A fuzz/fuzz_targets 2>/dev/null)" ]; then
            echo "no fuzz targets yet; Phase 2+"
            exit 0
          fi
          cargo install cargo-fuzz --locked
          cargo fuzz build
