name: Build environment
on:
  push:
    branches: [codex/memory-throughput-foundation]
    paths: [.github/workflows/build-environment.yml]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v6
        with:
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy
      - name: Collect source and offline dependencies
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p /tmp/snell-build/source /tmp/snell-build/toolchain
          git archive HEAD | tar -x -C /tmp/snell-build/source
          cargo vendor --locked /tmp/snell-build/source/vendor > /tmp/vendor-config.toml
          cat /tmp/vendor-config.toml >> /tmp/snell-build/source/.cargo/config.toml
          # Rewrite the generated absolute vendor path for offline relocation.
          sed -i 's#"/tmp/snell-build/source/vendor"#"vendor"#' /tmp/snell-build/source/.cargo/config.toml
          cp -a "$(rustc --print sysroot)/." /tmp/snell-build/toolchain/
          tar -C /tmp -czf /tmp/snell-build.tar.gz snell-build
      - uses: actions/upload-artifact@v4
        with:
          name: snell-build-inputs
          path: /tmp/snell-build.tar.gz
          compression-level: 0
          retention-days: 1
