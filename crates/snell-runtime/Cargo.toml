[package]
name = "snell-runtime"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
license.workspace = true
repository.workspace = true
publish.workspace = true
description = "Tokio runtime for Snell client and server sessions"

[features]
default = []
unsafe-raw = ["snell-protocol/unsafe-raw"]

[dependencies]
snell-protocol = { path = "../snell-protocol", version = "1.0.0-rc.2" }
hickory-resolver.workspace = true
socket2 = { version = "0.6", features = ["all"] }
thiserror.workspace = true
tracing.workspace = true
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "signal",
  "sync",
  "time",
] }

[target.'cfg(unix)'.dependencies]
libc = "0.2"
rustix = { workspace = true }

[target.'cfg(windows)'.dependencies]
rustix = { workspace = true }

[dev-dependencies]
snell-testkit = { path = "../snell-testkit", version = "1.0.0-rc.2" }
tokio = { workspace = true, features = [
  "io-util",
  "macros",
  "net",
  "rt-multi-thread",
  "sync",
  "time",
] }

[[bench]]
name = "tcp_loopback"
harness = false

[[bench]]
name = "kdf_bound"
harness = false

[[bench]]
name = "reuse_loopback"
harness = false

[[bench]]
name = "udp_loopback"
harness = false
