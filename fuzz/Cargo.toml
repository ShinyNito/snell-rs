[package]
name = "snell-fuzz"
version = "0.0.0"
publish = false
edition = "2024"

[package.metadata]
cargo-fuzz = true

[dependencies]
libfuzzer-sys = "0.4"
bytes = "1"
snell-protocol = { path = "../crates/snell-protocol" }

[workspace]
members = ["."]

[[bin]]
name = "record_decode"
path = "fuzz_targets/record_decode.rs"
test = false
doc = false
bench = false

[[bin]]
name = "record_roundtrip"
path = "fuzz_targets/record_roundtrip.rs"
test = false
doc = false
bench = false
