name: Export offline verification inputs
on:
  push:
    branches: [codex/verify-memory-throughput]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ec020bc3edc05f7c53d31be6b286915ec795b0b5
          path: source
          persist-credentials: false
      - uses: dtolnay/rust-toolchain@1.98.0
      - name: Download dependencies without compiling repository code
        run: cargo fetch --manifest-path source/fuzz/Cargo.toml
      - name: Prepare dependency audit executable and advisory database
        run: |
          cd "$RUNNER_TEMP"
          cargo +1.98.0 install cargo-deny --locked
          mkdir -p "$GITHUB_WORKSPACE/export"
          cp "$HOME/.cargo/bin/cargo-deny" "$GITHUB_WORKSPACE/export/"
          git clone --depth 1 https://github.com/RustSec/advisory-db.git advisory-db
          git -C advisory-db rev-parse HEAD > "$GITHUB_WORKSPACE/export/ADVISORY_COMMIT"
          tar -czf "$GITHUB_WORKSPACE/export/advisories.tar.gz" advisory-db
          tar -czf "$GITHUB_WORKSPACE/export/registry.tar.gz" -C "$HOME/.cargo" registry
      - uses: actions/upload-artifact@v4
        with:
          name: offline-fuzz-and-audit-inputs
          path: export/
          compression-level: 0
          retention-days: 2
