# Linux tcp-brutal. Fail-closed if the kernel module is missing.
# snell-rs server --config examples/server-tcp-brutal.ini

[snell-server]
listen = 0.0.0.0:8388
psk = example-psk-16-bytes
version = v6-default
tcp_brutal = true
# SI megabits, 1..=100000. Required when tcp_brutal = true.
tcp_brutal_send_mbps = 100
# Tenths, 5..=80. Required when tcp_brutal = true.
tcp_brutal_cwnd_gain = 15
