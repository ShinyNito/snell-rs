name: Fuzz

on:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: "17 4 * * *"

permissions:
  contents: read

jobs:
  fuzz:
    timeout-minutes: 20
    runs-on: ubuntu-latest
    env:
      RUSTUP_TOOLCHAIN: nightly
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - name: Install cargo-fuzz
        run: cargo install cargo-fuzz --locked
      - name: Decode malformed records
        run: cargo fuzz run record_decode -- -max_total_time=30 -max_len=134836 -rss_limit_mb=1024
      - name: Fragmented authenticated roundtrips
        run: cargo fuzz run record_roundtrip -- -max_total_time=30 -max_len=65538 -rss_limit_mb=1024
      - uses: actions/upload-artifact@v4
        if: failure()
        with:
          name: fuzz-crashes
          path: fuzz/artifacts
