# Server with SOCKS5 outbound (TCP CONNECT and UDP ASSOCIATE are separate).
# snell-rs server --config examples/server-socks5.ini
#
# Snell UDP replies must carry an IP source; Surge drops domain-typed ones.
# If the upstream maps UDP reply sources back to domains, snell-rs drops those
# replies and logs a warning. For sing-box, set on the SOCKS5/mixed inbound:
#   "udp_disable_domain_unmapping": true

[snell-server]
listen = 0.0.0.0:8388
psk = example-psk-16-bytes
version = 6
mode = default
upstream_socks5 = 127.0.0.1:1081
