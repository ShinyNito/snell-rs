name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          components: rustfmt, clippy

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Build process-test binary
        shell: bash
        run: |
          cargo build --locked -p snell
          binary="$PWD/target/debug/snell-rs"
          if [[ "$RUNNER_OS" == "Windows" ]]; then binary="$binary.exe"; fi
          echo "SNELL_RS_TEST_BIN=$binary" >> "$GITHUB_ENV"

      - name: Run tests
        run: cargo test --workspace --locked --all-features

      - name: cargo deny
        if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  cross-build:
    name: Build ${{ matrix.target }} ${{ matrix.cpu }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cpu: x86-64-v2
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cpu: x86-64-v3
          - os: ubuntu-latest
            target: x86_64-unknown-linux-gnu
            cpu: x86-64-v4
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-gnu
            cpu: generic
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cpu: x86-64-v2
            musl: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cpu: x86-64-v3
            musl: true
          - os: ubuntu-latest
            target: x86_64-unknown-linux-musl
            cpu: x86-64-v4
            musl: true
          - os: ubuntu-24.04-arm
            target: aarch64-unknown-linux-musl
            cpu: generic
            musl: true
          - os: macos-latest
            target: aarch64-apple-darwin
            cpu: apple-m1
          - os: macos-latest
            target: x86_64-apple-darwin
            cpu: x86-64-v2
          - os: macos-latest
            target: x86_64-apple-darwin
            cpu: x86-64-v3
          - os: macos-latest
            target: x86_64-apple-darwin
            cpu: x86-64-v4
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cpu: x86-64-v2
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cpu: x86-64-v3
          - os: windows-latest
            target: x86_64-pc-windows-msvc
            cpu: x86-64-v4
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.0
        with:
          targets: ${{ matrix.target }}

      - name: Install musl-tools
        if: matrix.musl
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        env:
          RUSTFLAGS: "-Ctarget-cpu=${{ matrix.cpu }}"
        run: cargo build --release --locked --target ${{ matrix.target }} -p snell
