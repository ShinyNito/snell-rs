name: CI

on:
  push:
    branches: ["**"]
    tags-ignore: ["**"]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

env:
  CARGO_TERM_COLOR: always

jobs:
  test:
    name: Test ${{ matrix.os }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          components: rustfmt, clippy

      - name: Check formatting
        if: matrix.os == 'ubuntu-latest'
        run: cargo fmt --all -- --check

      - name: Run clippy
        run: cargo clippy --workspace --locked --all-targets --all-features -- -D warnings

      - name: Run tests
        run: cargo test --workspace --locked --all-features

      - name: cargo deny
        if: matrix.os == 'ubuntu-latest'
        uses: EmbarkStudios/cargo-deny-action@v2
        with:
          command: check

  # Compile-and-link check for release targets that the test job does not
  # already build natively (x86_64 Linux gnu, aarch64 macOS, x86_64 Windows).
  # Per-CPU-level release builds (fat LTO) run only in release.yml.
  cross-build:
    name: Build ${{ matrix.targets }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            targets: x86_64-unknown-linux-musl
          - os: ubuntu-24.04-arm
            targets: aarch64-unknown-linux-gnu,aarch64-unknown-linux-musl
          - os: macos-latest
            targets: x86_64-apple-darwin
    env:
      CARGO_TARGET_X86_64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
      CARGO_TARGET_AARCH64_UNKNOWN_LINUX_MUSL_LINKER: musl-gcc
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@1.98.1
        with:
          targets: ${{ matrix.targets }}

      - name: Install musl-tools
        if: contains(matrix.targets, 'musl')
        run: sudo apt-get update && sudo apt-get install -y musl-tools

      - name: Build
        shell: bash
        run: |
          for target in ${MATRIX_TARGETS//,/ }; do
            cargo build --locked --target "${target}" -p snell
          done
        env:
          MATRIX_TARGETS: ${{ matrix.targets }}
