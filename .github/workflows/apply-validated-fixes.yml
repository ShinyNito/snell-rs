name: Apply validated fixes
on:
  push:
    branches: [codex/memory-throughput-foundation]
    paths: [.github/workflows/apply-validated-fixes.yml]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-24.04
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v6
        with:
          ref: codex/memory-throughput-foundation
      - name: Apply checked source delta
        shell: bash
        env:
          EXPECTED_HEAD: ${{ github.sha }}
        run: |
          set -euo pipefail
          test "$(git rev-parse HEAD)" = "$EXPECTED_HEAD"
          python3 - <<'PY'
          import hashlib
          from pathlib import Path
          p = Path('crates/snell-runtime/src/tests.rs')
          s = p.read_text()
          start = s.index('#[tokio::test]\nasync fn early_payload_over_64kib_is_rejected()')
          end = s.index('#[tokio::test]\nasync fn unavailable_tcp_brutal', start)
          replacement = '''#[tokio::test]
          async fn early_payload_limit_is_independent_of_socket_readiness() {
              use snell_protocol::{
                  EncodeBuffer, MAX_CONNECT_REQUEST_LEN, SERVER_EARLY_PAYLOAD_MAX, encode_connect_request,
              };

              let psk = Psk::new(PSK).unwrap();
              let destination = Address::from("127.0.0.1:9".parse::<SocketAddr>().unwrap());
              let kdf = KdfLimiter::new();
              for payload_len in [SERVER_EARLY_PAYLOAD_MAX, SERVER_EARLY_PAYLOAD_MAX + 1] {
                  let mut encoder = V4Encoder::os(&psk).unwrap();
                  let mut encode = EncodeBuffer::new(256 * 1024);
                  let mut req = [0u8; MAX_CONNECT_REQUEST_LEN];
                  let n = encode_connect_request(&mut req, destination.as_view(), false).unwrap();
                  let mut plain = req[..n].to_vec();
                  plain.resize(n + payload_len, b'x');
                  let mut offset = 0;
                  while offset < plain.len() {
                      let mut reservation = encoder
                          .reserve(&mut encode, &[], plain.len() - offset)
                          .unwrap();
                      let take = reservation.capacity().min(plain.len() - offset);
                      reservation.payload_mut()[..take].copy_from_slice(&plain[offset..offset + take]);
                      reservation.seal(take).unwrap();
                      offset += take;
                  }
                  // All input is ready: a real socket may return Pending between segments,
                  // at which point later bytes belong to steady relay, not early prefetch.
                  let mut wire = encode.pending();
                  let mut decoder = V4Decoder::new(psk.clone());
                  let mut recv = crate::session::new_recv();
                  let result = crate::session::read_server_connect(
                      &mut decoder,
                      &mut recv,
                      &mut wire,
                      &kdf,
                      &psk,
                      None,
                  )
                  .await;
                  if payload_len > SERVER_EARLY_PAYLOAD_MAX {
                      assert!(matches!(result, Err(SessionError::EarlyPayloadTooLarge)));
                  } else {
                      let crate::session::ServerFirst::Connect(connect) = result.unwrap() else {
                          panic!("expected CONNECT");
                      };
                      assert_eq!(connect.leftover, vec![b'x'; payload_len]);
                  }
              }
          }

          '''
          s = s[:start] + replacement + s[end:]
          assert hashlib.sha256(s.encode()).hexdigest() == '37c270fb14b4d5c0f037e396a0d1a0379f5558d0739e292eb7830213003387fd'
          p.write_text(s)
          p = Path('crates/snell-protocol/src/buffer.rs')
          s = p.read_text().replace('        let target = needed\n', '        let mut target = needed\n')
          s = s.replace('        storage.reserve_exact(target - storage.len());', '''        // Skip a near-identical final reallocation, e.g. 64 KiB -> 67 KiB.
                  if target > max / 2 {
                      target = max;
                  }
                  storage.reserve_exact(target - storage.len());''')
          marker = '    #[test]\n    fn initialized_buf_mut_does_not_expose_unwritten_tail()'
          replacement = '''    #[test]
              fn final_growth_step_keeps_bulk_allocation_stable() {
                  let max = crate::V6_WIRE_CAP;
                  let mut recv = RecvBuffer::new(max);
                  let mut encode = EncodeBuffer::new(max);
                  recv.extend_from_slice(&vec![1; 40_000]).unwrap();
                  encode.reserve_zeroed(40_000).unwrap();
                  let recv_ptr = recv.filled().as_ptr();
                  let encode_ptr = encode.pending().as_ptr();
                  recv.extend_from_slice(&vec![2; max - 40_000]).unwrap();
                  encode.reserve_zeroed(max - 40_000).unwrap();
                  assert_eq!(recv.filled().as_ptr(), recv_ptr);
                  assert_eq!(encode.pending().as_ptr(), encode_ptr);
                  assert_eq!(recv.len(), max);
                  assert_eq!(encode.len(), max);
              }

          '''
          s = s.replace(marker, replacement + marker)
          assert hashlib.sha256(s.encode()).hexdigest() == '43246d8bf260e988b4c23bf502aca26c78246a9ddd789b0cbc6b87104395158c'
          p.write_text(s)
          PY
          git rm .github/workflows/apply-validated-fixes.yml
          git add crates/snell-runtime/src/tests.rs crates/snell-protocol/src/buffer.rs
          git diff --cached --check
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git commit -m 'fix: stabilize early payload boundaries and final buffer growth'
          git push origin HEAD:codex/memory-throughput-foundation
