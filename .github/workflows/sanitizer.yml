name: Sanitizer

on:
  workflow_dispatch:
  schedule:
    - cron: "17 6 * * 1"

permissions:
  contents: read

jobs:
  asan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: dtolnay/rust-toolchain@nightly
      - name: Skip until unsafe modules exist
        run: |
          echo "ASan/UBSan are required when unsafe buffer or platform FFI lands."
