name: Export offline verification inputs
on:
  push:
    branches: [codex/verify-memory-throughput]
permissions:
  contents: read
jobs:
  export:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v6
        with:
          ref: ec020bc3edc05f7c53d31be6b286915ec795b0b5
          path: source
          persist-credentials: false
      - name: Archive pinned source without executing repository code
        run: |
          mkdir export
          git -C source archive HEAD | gzip > export/source.tar.gz
          git -C source rev-parse HEAD > export/COMMIT
      - uses: actions/upload-artifact@v4
        with:
          name: current-source
          path: export/
          retention-days: 2
      - uses: dtolnay/rust-toolchain@nightly
        with:
          components: miri, rust-src
      - name: Prepare independent offline verification tools
        run: |
          set -euo pipefail
          cd "$RUNNER_TEMP"
          cargo +nightly miri setup
          cargo +nightly install cargo-fuzz --locked
          mkdir -p "$GITHUB_WORKSPACE/tools"
          sysroot=$(rustc +nightly --print sysroot)
          tar -czf "$GITHUB_WORKSPACE/tools/nightly.tar.gz" -C "$sysroot" bin lib libexec
          tar -czf "$GITHUB_WORKSPACE/tools/registry.tar.gz" -C "$HOME/.cargo" registry
          cp "$HOME/.cargo/bin/cargo-fuzz" "$GITHUB_WORKSPACE/tools/"
          if [ -d "$HOME/.cache/miri" ]; then
            tar -czf "$GITHUB_WORKSPACE/tools/miri-sysroot.tar.gz" -C "$HOME/.cache/miri" .
          fi
      - uses: actions/upload-artifact@v4
        with:
          name: offline-verification-tools
          path: tools/
          compression-level: 0
          retention-days: 2
