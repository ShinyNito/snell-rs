# Snell server. Omitting version enables auto-detect (v4 and v6-shaped).
# snell-rs server --config examples/server.ini

[snell-server]
# Snell listen address (required).
listen = 0.0.0.0:8388
# Raw UTF-8 PSK, length 16..=255 (required).
psk = example-psk-16-bytes
# Optional. 4 | 5 | 6 | v4 | v5 | v6-default | v6-unshaped.
# version = 6
# Only valid when version = 6: default | unshaped.
# mode = default
# SOCKS5 outbound. Omit for Direct.
# upstream_socks5 = 127.0.0.1:1081
